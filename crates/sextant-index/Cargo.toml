[package]
name = "sextant-index"
version.workspace = true
edition.workspace = true
description = "Vector index physical layer: a self-describing page format for fixed-stride rows on paged memory, and distance kernels (L2, dot, early exit) over f32, i8 and u8 rows with wasm SIMD."
repository = "https://github.com/perforate-org/sextant"
keywords = ["vector", "ann", "simd", "wasm", "no-std"]
categories = ["data-structures", "algorithms", "no-std"]
license = "MIT OR Apache-2.0"
rust-version = "1.88"
readme = "../../README.md"
autotests = false

[lints]
workspace = true

[features]
default = []
# Every ic-stable-structures memory (a `VirtualMemory` from a `MemoryManager`, say) is a
# sextant-index memory.
ic-stable-structures = ["dep:ic-stable-structures"]

[dependencies]
ic-stable-structures = { version = "0.7", optional = true }

[dev-dependencies]
expect-test = "1.5"
proptest = "1"
public-api = "0.52"
rustdoc-json = "0.9"

[[test]]
name = "kernel"

[[test]]
name = "page"

[[test]]
name = "public_api"

[[test]]
name = "stable_structures"
required-features = ["ic-stable-structures"]
